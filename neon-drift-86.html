/* ==== styles.css (6.7 kB) ==== */
/* ==========================================================================
   NEON DRIFT '86 — page chrome
   The game itself draws every gameplay pixel into #screen; this file only
   styles the arcade cabinet around it. No external fonts, no images.
   ========================================================================== */

:root {
  --ink:        #f4f0ff;
  --dim:        #7d76a8;
  --neon-pink:  #ff2fb9;
  --neon-cyan:  #22e0ff;
  --neon-amber: #ffc46b;
  --cab-metal:  #16121f;
  --cab-edge:   #2b2440;
  --cab-black:  #07060d;
  --mono: "Consolas", "DejaVu Sans Mono", "Courier New", ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--cab-black);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: none;
  font-smooth: never;
  text-rendering: geometricPrecision;
  -webkit-tap-highlight-color: transparent;
  /* the arcade floor: a faint perspective grid that fades out */
  background-image:
    radial-gradient(ellipse 120% 80% at 50% 0%, rgba(255, 47, 185, 0.13), transparent 60%),
    radial-gradient(ellipse 100% 70% at 50% 110%, rgba(34, 224, 255, 0.10), transparent 62%),
    linear-gradient(transparent 0 96%, rgba(34, 224, 255, 0.08) 96% 100%),
    linear-gradient(90deg, transparent 0 96%, rgba(255, 47, 185, 0.06) 96% 100%);
  background-size: auto, auto, 26px 26px, 26px 26px;
  user-select: none;
  -webkit-user-select: none;
}

/* ------------------------------------------------------------------ layout */

.cabinet {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  max-height: 100%;
}

/* ----------------------------------------------------------------- marquee */

.marquee { text-align: center; margin: 0; }

.marquee-main {
  margin: 0;
  font-size: clamp(15px, 3.2vh, 30px);
  letter-spacing: 0.16em;
  font-weight: 700;
  color: var(--neon-pink);
  text-shadow:
     0 0 4px rgba(255, 47, 185, 0.9),
     0 0 18px rgba(255, 47, 185, 0.55),
     2px 2px 0 #4a0033;
}

.marquee-year { color: var(--neon-cyan); text-shadow: 0 0 4px rgba(34,224,255,.9), 0 0 18px rgba(34,224,255,.5); }

.marquee-sub {
  margin: 4px 0 0;
  font-size: clamp(7px, 1.25vh, 11px);
  letter-spacing: 0.34em;
  color: var(--dim);
}

/* ------------------------------------------------------------------ screen */

.screen-frame {
  position: relative;
  line-height: 0;
  padding: 10px;
  border-radius: 14px;
  background: linear-gradient(180deg, #241d33, var(--cab-metal) 45%, #0d0a15);
  border: 1px solid var(--cab-edge);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.85),
    0 18px 44px rgba(0, 0, 0, 0.75),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

#screen {
  display: block;
  background: #000;
  border-radius: 5px;
  outline: none;
  cursor: none;
  touch-action: none;
  /* the canvas is integer-upscaled by GAME; keep every pixel crisp */
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  box-shadow:
    0 0 0 2px #000,
    0 0 26px rgba(34, 224, 255, 0.16),
    0 0 60px rgba(255, 47, 185, 0.12);
}

#screen:focus-visible { box-shadow: 0 0 0 2px var(--neon-cyan), 0 0 26px rgba(34, 224, 255, 0.3); }

/* ---------------------------------------------------------------------------
   CRT aperture grille + dome glare.

   IMPORTANT: the scanlines live HERE, in CSS at *output* resolution — not in
   the 384x216 canvas. Baked into the backbuffer they get integer-multiplied
   into 3-5px stripes and crush the whole image; as a CSS overlay they stay a
   crisp 1px regardless of upscale factor, and cost the renderer nothing.
   `.glass` sits exactly over the canvas (same inset as the frame padding) and
   never intercepts pointer events.
   --------------------------------------------------------------------------- */
.glass {
  position: absolute;
  inset: 10px;
  border-radius: 5px;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70% 42% at 30% 4%, rgba(255, 255, 255, 0.05), transparent 70%),
    radial-gradient(ellipse 125% 105% at 50% 50%, transparent 62%, rgba(0, 0, 0, 0.30) 100%);
}

.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 5px;
  /* 1 dark row in every 3 — subtle enough to keep the neon readable */
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0.20) 0 1px,
    rgba(0, 0, 0, 0) 1px 3px
  );
  /* a whisper of horizontal phosphor mask so it reads as glass, not stripes */
  background-blend-mode: normal;
}

@media (min-resolution: 2dppx) {
  /* on hidpi a 3px period is sub-pixel-ish; widen slightly so it still reads */
  .glass::after {
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.18) 0 1px,
      rgba(0, 0, 0, 0) 1px 4px
    );
  }
}

/* ------------------------------------------------------------------ splash */

.splash {
  position: absolute;
  inset: 10px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #05040a;
  color: var(--neon-amber);
  font-size: clamp(9px, 1.7vh, 15px);
  letter-spacing: 0.24em;
  line-height: 1.6;
  transition: opacity 0.28s ease;
  z-index: 2;
}

.splash.hidden { opacity: 0; pointer-events: none; }
.splash.error { color: #ff6060; }
.splash.error .splash-sub { font-size: 0.72em; letter-spacing: 0.1em; max-width: 80%; text-align: center; }

.splash-title { text-shadow: 0 0 10px rgba(255, 196, 107, 0.75); }
.splash-sub { font-size: 0.74em; color: var(--dim); letter-spacing: 0.18em; }

/* ---------------------------------------------------------------- controls */

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 14px;
  max-width: 760px;
  font-size: clamp(7px, 1.2vh, 11px);
  color: var(--dim);
}

.ctrl { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

kbd {
  display: inline-block;
  min-width: 16px;
  padding: 2px 4px;
  border: 1px solid #3a3157;
  border-bottom-width: 2px;
  border-radius: 4px;
  background: #1c1730;
  color: var(--ink);
  font: inherit;
  font-size: 0.94em;
  text-align: center;
  line-height: 1.15;
}

.ctrl span { color: #9c94c4; }

.footnote {
  margin: 0;
  max-width: 760px;
  text-align: center;
  font-size: clamp(6.5px, 1.05vh, 10px);
  line-height: 1.7;
  color: #5b5580;
  letter-spacing: 0.06em;
}

/* very short viewports: drop the chrome so the cabinet always fits */
@media (max-height: 520px) {
  .marquee-sub, .footnote { display: none; }
  .cabinet { gap: 6px; }
}

@media (max-width: 560px) {
  .footnote { display: none; }
  .controls { gap: 4px 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .splash { transition: none; }
}

    '_': [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x1F],
    '+': [0x00, 0x04, 0x04, 0x1F, 0x04, 0x04, 0x00],
    '=': [0x00, 0x00, 0x1F, 0x00, 0x1F, 0x00, 0x00],
    '*': [0x00, 0x0A, 0x04, 0x1F, 0x04, 0x0A, 0x00],
    '/': [0x01, 0x01, 0x02, 0x04, 0x08, 0x10, 0x10],
    '\\': [0x10, 0x10, 0x08, 0x04, 0x02, 0x01, 0x01],
    '!': [0x04, 0x04, 0x04, 0x04, 0x04, 0x00, 0x04],
    '?': [0x0E, 0x11, 0x01, 0x02, 0x04, 0x00, 0x04],
    '%': [0x11, 0x01, 0x02, 0x04, 0x08, 0x10, 0x11],
    '(': [0x04, 0x08, 0x10, 0x10, 0x10, 0x08, 0x04],
    ')': [0x04, 0x02, 0x01, 0x01, 0x01, 0x02, 0x04],
    '[': [0x0E, 0x08, 0x08, 0x08, 0x08, 0x08, 0x0E],
    ']': [0x0E, 0x02, 0x02, 0x02, 0x02, 0x02, 0x0E],
    '<': [0x02, 0x04, 0x08, 0x10, 0x08, 0x04, 0x02],
    '>': [0x08, 0x04, 0x02, 0x01, 0x02, 0x04, 0x08],
    '#': [0x0A, 0x1F, 0x0A, 0x0A, 0x1F, 0x0A, 0x00],
    '&': [0x0C, 0x12, 0x14, 0x08, 0x15, 0x12, 0x0D],
    '@': [0x0E, 0x11, 0x17, 0x15, 0x17, 0x10, 0x0E],
    '"': [0x0A, 0x0A, 0x00, 0x00, 0x00, 0x00, 0x00],
    "'": [0x04, 0x04, 0x08, 0x00, 0x00, 0x00, 0x00],
    '^': [0x04, 0x0A, 0x11, 0x00, 0x00, 0x00, 0x00],
    '~': [0x00, 0x00, 0x09, 0x16, 0x00, 0x00, 0x00],
    '$': [0x04, 0x0F, 0x14, 0x0E, 0x05, 0x1E, 0x04],
    '|': [0x04, 0x04, 0x04, 0x04, 0x04, 0x04, 0x04],
    '\u2665': [0x00, 0x0A, 0x1F, 0x1F, 0x0E, 0x04, 0x00],   /* heart  */
    '\u25B2': [0x04, 0x0E, 0x1F, 0x1F, 0x00, 0x00, 0x00],   /* up     */
    '\u25BC': [0x00, 0x00, 0x00, 0x1F, 0x1F, 0x0E, 0x04],   /* down   */
    '\u25C0': [0x01, 0x03, 0x07, 0x0F, 0x07, 0x03, 0x01],   /* left   */
    '\u25B6': [0x10, 0x18, 0x1C, 0x1E, 0x1C, 0x18, 0x10],   /* right  */
    '\u2588': [0x1F, 0x1F, 0x1F, 0x1F, 0x1F, 0x1F, 0x1F],   /* block  */
    '\u2592': [0x15, 0x0A, 0x15, 0x0A, 0x15, 0x0A, 0x15],   /* dither */
    '\u00B7': [0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00]    /* dot    */
  };

  var GLYPH_KEYS = (function () {
    var k = [], c;
    for (c in GLYPHS) { if (Object.prototype.hasOwnProperty.call(GLYPHS, c)) { k.push(c); } }
    return k;
  })();

  var GLYPH_INDEX = (function () {
    var m = {}, i;
    for (i = 0; i < GLYPH_KEYS.length; i++) { m[GLYPH_KEYS[i]] = i; }
    return m;
  })();

  var CELL_W = FONT_W + 1;              /* 1px gutter between cells in the atlas */
  var atlasCache = {};

  /* Pre-render every glyph once per colour; drawText then costs one drawImage
     per character instead of 35 fillRects. */
  function atlas(color) {
    if (atlasCache[color]) { return atlasCache[color]; }
    var cv = makeCanvas(GLYPH_KEYS.length * CELL_W, FONT_H);
    var g = cv.getContext('2d');
    g.fillStyle = color;
    var i, x, y, bits, ch;
    for (i = 0; i < GLYPH_KEYS.length; i++) {
      ch = GLYPHS[GLYPH_KEYS[i]];
      for (y = 0; y < FONT_H; y++) {
        bits = ch[y];
        for (x = 0; x < FONT_W; x++) {
          if (bits & (1 << (FONT_W - 1 - x))) { g.fillRect(i * CELL_W + x, y, 1, 1); }
        }
      }
    }
    atlasCache[color] = cv;
    return cv;
  }

  function textWidth(text, scale, spacing) {
    scale = Math.max(1, (scale | 0) || 1);
    spacing = (spacing === undefined || spacing === null) ? 1 : spacing;
    var n = String(text).length;
    if (n === 0) { return 0; }
    return (n * (FONT_W + spacing) - spacing) * scale;
  }

  function drawText(ctx, text, x, y, opts) {
    opts = opts || {};
    var scale = Math.max(1, (opts.scale | 0) || 1);
    var spacing = (opts.spacing === undefined || opts.spacing === null) ? 1 : opts.spacing;
    var color = opts.color || '#ffffff';
    var align = opts.align || 'left';
    var str = String(text).toUpperCase();
    var step = (FONT_W + spacing) * scale;

    var w = textWidth(str, scale, spacing);
    var dy = 0;
    if (opts.baseline === 'middle') { dy = -Math.round(FONT_H * scale / 2); }
    x = Math.round(x); y = Math.round(y) + dy;
    if (align === 'center') { x -= Math.round(w / 2); }
    else if (align === 'right') { x -= w; }

    if (opts.shadow) {
      drawText(ctx, str, x + scale, y + scale, {
        color: typeof opts.shadow === 'string' ? opts.shadow : '#000000',
        scale: scale, spacing: spacing, align: 'left'
      });
    }

    var a = atlas(color), i, gi;
    for (i = 0; i < str.length; i++) {
      gi = GLYPH_INDEX[str.charAt(i)];
      if (gi === undefined) { continue; }
      ctx.drawImage(a, gi * CELL_W, 0, FONT_W, FONT_H,
                    x + i * step, y, FONT_W * scale, FONT_H * scale);
    }
    return w;
  }

  /* ============================================================== STATE === */
  /* The frozen per-frame contract between GAME (writer) and RENDER (reader). */
  function createState() {
    return {
      /* timing */
      now: 0, dt: 0, frame: 0, fps: 60,

      /* flow */
      mode: 'boot', prevMode: '', modeTime: 0,

      /* player */
      position: 0, speed: 0, playerX: 0, playerY: 0,
      steer: 0, throttle: 0, brake: 0,
      gear: 1, rpm: 0, shiftTimer: 0,

      /* stage / progress */
      stageIndex: 0, stage: 0, lap: 1, laps: 2,
      trackLength: 0, track: null, segments: [], cars: [],
      checkpoint: 0, checkpoints: [], nextCheckpoint: 0,
      timeLeft: 0, lapTime: 0, lastLapTime: 0, bestLapTime: 0, totalTime: 0,
      score: 0, combo: 0, best: 0,

      /* camera / parallax */
      cameraHeight: TUNING.CAMERA_HEIGHT, cameraDepth: TUNING.CAMERA_DEPTH,
      playerZ: TUNING.PLAYER_Z,
      skyOffset: 0, hillOffset: 0, treeOffset: 0,

      /* fx */
      shake: 0, shakeX: 0, shakeY: 0, flash: 0,
      hitTimer: 0, offRoad: false, skid: false,
      crash: false, crashTimer: 0, crashX: 0, crashY: 0, crashFrame: 0,

      /* ui */
      menuIndex: 0, menuItems: [], countdown: 0,
      paused: false, muted: false, quality: 'high', showFps: false,
      hint: '',

      /* transient messages: {text,color,scale,x,y,ttl,ttl0} */
      messages: [],

      /* theme + results */
      theme: THEMES.sunset,
      results: null,

      /* debug */
      errors: []
    };
  }

  /* ============================================================ SELFTEST == */
  function selfTest() {
    var checks = [];
    function ck(name, ok, detail) { checks.push({ name: name, ok: !!ok, detail: detail || '' }); }

    ck('resolution', W === 384 && H === 216, W + 'x' + H);
    ck('math.clamp', clamp(5, 0, 3) === 3 && clamp(-1, 0, 3) === 0);
    ck('math.increase-wrap', increase(10, 5, 12) === 3, String(increase(10, 5, 12)));
    ck('math.increase-neg', increase(1, -5, 12) === 8, String(increase(1, -5, 12)));
    ck('math.wrapZ', wrapZ(-100, 1000) === 900, String(wrapZ(-100, 1000)));
    ck('math.overlap', overlap(0, 10, 4, 10, 1) === true && overlap(0, 2, 40, 2, 1) === false);

    var r1 = rng(42), r2 = rng(42);
    ck('rng.deterministic', r1() === r2(), 'first draws equal');
    var v = rng(42)();
    ck('rng.range', v >= 0 && v < 1, String(v));

    ck('font.width', textWidth('AB', 1, 1) === 11, String(textWidth('AB', 1, 1)));
    ck('font.width2', textWidth('AB', 2, 1) === 22, String(textWidth('AB', 2, 1)));
    ck('font.glyph-count', GLYPH_KEYS.length >= 60, String(GLYPH_KEYS.length));
    ck('font.has-digits', '0' in GLYPH_INDEX && '9' in GLYPH_INDEX);
    ck('font.has-letters', 'A' in GLYPH_INDEX && 'Z' in GLYPH_INDEX);

    var tk = Object.keys(THEMES);
    ck('themes.count', tk.length === 3, tk.join(','));
    var ti, th, tOk = true, tWhy = '';
    for (ti = 0; ti < tk.length; ti++) {
      th = THEMES[tk[ti]];
      var need = ['sky', 'sunCore', 'sunGlow', 'sunBand', 'mountFar', 'mountNear', 'grassDark',
        'grassLight', 'roadDark', 'roadLight', 'rumbleDark', 'rumbleLight', 'lane', 'fog',
        'crtTint', 'scenery'];
      for (var qi = 0; qi < need.length; qi++) {
        if (th[need[qi]] === undefined) { tOk = false; tWhy += tk[ti] + '.' + need[qi] + ' '; }
      }
      if (!(th.sky instanceof Array) || th.sky.length < 4) { tOk = false; tWhy += tk[ti] + '.sky '; }
    }
    ck('themes.complete', tOk, tWhy);
    ck('stages.count', STAGES.length === 3 && STAGES[2].laps === 2);

    ck('tuning.cameraDepth', TUNING.CAMERA_DEPTH > 0.8 && TUNING.CAMERA_DEPTH < 0.9,
      TUNING.CAMERA_DEPTH.toFixed(4));
    ck('tuning.step', Math.abs(TUNING.STEP - 1 / 60) < 1e-9);

    ck('format.time', formatTime(83.456) === '1:23.46', formatTime(83.456));
    ck('format.time-bad', formatTime(NaN) === '--:--.--');
    ck('format.score', formatScore(1234) === '0001234', formatScore(1234));
    ck('format.pad', pad(7, 3) === '007' && pad(-7, 3) === '-007');

    var s = createState();
    ck('state.shape', s.mode === 'boot' && s.segments instanceof Array && s.theme === THEMES.sunset);
    ck('state.required-fields',
      ['track', 'cars', 'checkpoints', 'messages', 'results', 'quality', 'skyOffset',
        'hillOffset', 'treeOffset', 'cameraDepth', 'playerZ', 'crashFrame'].every(function (k) {
          return k in s;
        }));

    var ok = true, i;
    for (i = 0; i < checks.length; i++) { if (!checks[i].ok) { ok = false; } }
    return { ok: ok, checks: checks };
  }

  /* ================================================================ EXPORT */
  return {
    VERSION: VERSION,
    W: W, H: H, TAU: TAU,

    clamp: clamp, lerp: lerp,
    easeIn: easeIn, easeOut: easeOut, easeInOut: easeInOut,
    accelerate: accelerate, percentRemaining: percentRemaining,
    overlap: overlap, increase: increase, wrapZ: wrapZ,

    rng: rng, rnd: rnd, rndInt: rndInt, pick: pick,

    makeCanvas: makeCanvas, now: now, storage: storage,
    pad: pad, formatTime: formatTime, formatScore: formatScore,

    TUNING: TUNING, THEMES: THEMES, STAGES: STAGES, UI: UI,

    FONT_W: FONT_W, FONT_H: FONT_H, GLYPHS: GLYPHS,
    textWidth: textWidth, drawText: drawText,

    createState: createState, selfTest: selfTest
  };
})();

<script>
/* ==== src/road.js (17.8 kB) ==== */
/* ==========================================================================
 * NEON DRIFT '86  —  src/road.js
 * Track geometry: segment construction, perspective projection and the
 * initial placement of AI traffic.
 *
 * NO canvas / document / DOM access anywhere in this file (it must load and
 * run under node).  Depends on: CORE.  Exposes the single global `ROAD`.
 *
 * Load order: core.js -> road.js -> sprites.js -> audio.js -> render.js
 * ========================================================================== */
var ROAD = (function () {
  'use strict';

  var T = CORE.TUNING;
  var SEG_LEN = T.SEGMENT_LENGTH;        /* 200  */
  var RUMBLE_LEN = T.RUMBLE_LENGTH;      /* 3    */
  var ROAD_WIDTH = T.ROAD_WIDTH;         /* 2000 */

  /* curve is a per-segment steering accumulator (see the classic out-run model):
     `dx += curve` each segment, `x += dx` each segment. */
  var CURVE = { NONE: 0, EASY: 1.7, MEDIUM: 3.1, HARD: 4.5, HAIRPIN: 6.2, MAX: 7.5 };

  /* slope is expressed as a fraction of the horizontal run, so hill height
     scales with section length and never becomes a wall. */
  var SLOPE = { NONE: 0, LOW: 0.15, MEDIUM: 0.28, HIGH: 0.42, STEEP: 0.56 };

  var MIN_SEGMENTS = 1200;       /* contract floor  */
  var TARGET_SEGMENTS = 1320;    /* the fun part    */
  var OPENING_STRAIGHT = 46;     /* start / finish straight */
  var CLOSING_STRAIGHT = 40;
  var CHECKPOINT_GATES = 4;      /* gates per lap, one of them the lap line */

  var CAR_KINDS = [
    { sprite: 'car_red', w: 1080, h: 620, lo: 0.46, hi: 0.74 },
    { sprite: 'car_blue', w: 1080, h: 620, lo: 0.46, hi: 0.74 },
    { sprite: 'car_green', w: 1080, h: 620, lo: 0.46, hi: 0.74 },
    { sprite: 'car_yellow', w: 1080, h: 620, lo: 0.46, hi: 0.74 },
    { sprite: 'car_purple', w: 1080, h: 620, lo: 0.46, hi: 0.74 },
    { sprite: 'truck_white', w: 1520, h: 980, lo: 0.27, hi: 0.48 },
    { sprite: 'truck_blue', w: 1520, h: 980, lo: 0.27, hi: 0.48 }
  ];

  /* ======================================================== small helpers == */

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function newPoint(x, y, z) {
    return {
      world: { x: x, y: y, z: z },
      camera: { x: 0, y: 0, z: 0 },
      screen: { x: 0, y: 0, w: 0, scale: 0 }
    };
  }

  function newSegment(index, curve, y1, y2) {
    return {
      index: index,
      p1: newPoint(0, y1, index * SEG_LEN),
      p2: newPoint(0, y2, (index + 1) * SEG_LEN),
      curve: curve,
      sprites: [],
      cars: [],
      /* alternating ground colour; flips every RUMBLE_LENGTH segments */
      dark: (Math.floor(index / RUMBLE_LEN) % 2) === 1,
      looped: false,
      fog: 0,
      clip: 0,
      light: 0
    };
  }

  function lastY(track) {
    var segs = track.segments;
    return segs.length === 0 ? 0 : segs[segs.length - 1].p2.world.y;
  }

  function pushSegment(track, curve, y2) {
    var segs = track.segments;
    var y1 = segs.length === 0 ? 0 : segs[segs.length - 1].p2.world.y;
    segs.push(newSegment(segs.length, curve, y1, y2));
  }

  /* ---------------------------------------------------------- road pieces -- */

  /* enter/hold/leave are segment counts; `curve` is the held curve value and
     `slope` the held gradient (world-y delta / world-z delta). */
  function addRoad(track, enter, hold, leave, curve, slope) {
    var startY = lastY(track);
    var total = enter + hold + leave;
    if (total <= 0) { return; }
    var endY = startY + (slope || 0) * total * SEG_LEN;
    var n;

    for (n = 0; n < enter; n++) {
      pushSegment(track, CORE.easeIn(0, curve, n / enter), CORE.easeInOut(startY, endY, n / total));
    }
    for (n = 0; n < hold; n++) {
      pushSegment(track, curve, CORE.easeInOut(startY, endY, (enter + n) / total));
    }
    for (n = 0; n < leave; n++) {
      pushSegment(track, CORE.easeInOut(curve, 0, n / leave), CORE.easeInOut(startY, endY, (enter + hold + n) / total));
    }
  }

  function addStraight(track, len) { addRoad(track, 0, len, 0, 0, 0); }

  /* A run of alternating crests and dips; the 4-step pattern nets to zero so
     a bumpy stretch always returns to the height it started at. */
  function addBumps(track, len, amount) {
    var pattern = [1, -2, 1, 0];
    var n, y = lastY(track);
    len = len - (len % 4);
    for (n = 0; n < len; n++) {
      y = y + pattern[n % 4] * amount;
      pushSegment(track, 0, y);
    }
  }

  /* ---------------------------------------------------------- the recipe --- */

  function chooseSlope(track, hilly, rng) {
    var y = lastY(track);
    var bias = clamp(-y / 14000, -1, 1);        /* pull back toward sea level */
    var mag = 0.08 + rng() * 0.34;
    var s = (rng() < 0.5 ? -1 : 1) * mag;
    if (bias > 0.25 && s > 0) { s = -s; }
    if (bias < -0.25 && s < 0) { s = -s; }
    return s * hilly;
  }

  function buildMoves(track, stage, rng) {
    var curvy = stage.curviness || 1;
    var hilly = stage.hilliness || 1;
    var dir = rng() < 0.5 ? 1 : -1;
    var pattern = [
      'straight', 'curve', 'hill', 'scurve', 'straight', 'crest',
      'hairpin', 'dip', 'curve', 'bumps', 'straight', 'hill',
      'scurve', 'curve', 'hairpin', 'crest', 'bumps', 'dip'
    ];
    var pi = 0, kind, mag, len, c;

    addStraight(track, OPENING_STRAIGHT);

    while (track.segments.length < TARGET_SEGMENTS) {
      kind = pattern[pi % pattern.length];
      pi++;
      /* a long breather after every hairpin */
      mag = CURVE.EASY + rng() * (CURVE.HARD - CURVE.EASY);
      c = clamp(mag * curvy, 0, CURVE.MAX) * dir;

      if (kind === 'straight') {
        len = 26 + Math.floor(rng() * 38);
        addRoad(track, 6, len, 6, 0, chooseSlope(track, hilly, rng) * 0.4);
      } else if (kind === 'curve') {
        len = 34 + Math.floor(rng() * 34);
        addRoad(track, Math.round(len * 0.28), Math.round(len * 0.44), Math.round(len * 0.28),
          c, chooseSlope(track, hilly, rng) * 0.35);
        dir = -dir;
      } else if (kind === 'scurve') {
        len = 22 + Math.floor(rng() * 16);
        c = clamp(CURVE.MEDIUM * curvy, 0, CURVE.MAX) * dir;
        addRoad(track, Math.round(len * 0.3), Math.round(len * 0.4), Math.round(len * 0.3), c, 0);
        c = -c * 0.85;
        addRoad(track, Math.round(len * 0.3), Math.round(len * 0.4), Math.round(len * 0.3), c, 0);
        dir = -dir;
      } else if (kind === 'hairpin') {
        len = 40 + Math.floor(rng() * 22);
        c = clamp(CURVE.HAIRPIN * curvy, 0, CURVE.MAX) * dir;
        addRoad(track, 10, len, 14, c, chooseSlope(track, hilly, rng) * 0.25);
        dir = -dir;
      } else if (kind === 'hill') {
        len = 44 + Math.floor(rng() * 40);
        addRoad(track, Math.round(len * 0.32), Math.round(len * 0.36), Math.round(len * 0.32),
          0, chooseSlope(track, hilly, rng));
      } else if (kind === 'crest') {
        var up = 30 + Math.floor(rng() * 22);
        var down = 30 + Math.floor(rng() * 22);
        addRoad(track, 10, up, 8, 0, Math.abs(chooseSlope(track, hilly, rng)) * 1.15);
        addRoad(track, 8, down, 10, 0, -Math.abs(chooseSlope(track, hilly, rng)) * 1.15);
      } else if (kind === 'dip') {
        var dn = 26 + Math.floor(rng() * 20);
        var upn = 26 + Math.floor(rng() * 20);
        addRoad(track, 10, dn, 8, 0, -Math.abs(chooseSlope(track, hilly, rng)) * 1.1);
        addRoad(track, 8, upn, 10, 0, Math.abs(chooseSlope(track, hilly, rng)) * 1.1);
      } else if (kind === 'bumps') {
        len = 22 + Math.floor(rng() * 26);
        addStraight(track, 4);
        addBumps(track, len, (34 + rng() * 62) * hilly);
        addStraight(track, 4);
      }
    }
  }

  /* The eased y ramps never quite reach their target (the last step is at
     (total-1)/total), so a few world units of drift accumulate over the lap.
     Spread a linear correction over the final straight to land on exactly 0,
     otherwise the seam between the last and first segment would snap. */
  function snapToZero(track) {
    var segs = track.segments;
    var n = segs.length;
    if (n < 2) { return; }
    var resid = segs[n - 1].p2.world.y;
    if (!(Math.abs(resid) > 1e-9)) {
      segs[n - 1].p2.world.y = 0;
      return;
    }
    var k = Math.min(n - 1, CLOSING_STRAIGHT);
    var start = n - k;
    var i, f;
    for (i = start; i < n; i++) {
      f = (i - start + 1) / k;
      segs[i].p2.world.y = segs[i].p2.world.y - resid * f;
      if (i > start) { segs[i].p1.world.y = segs[i - 1].p2.world.y; }
    }
    segs[n - 1].p2.world.y = 0;
  }

  /* Bring the track back to y = 0 and curve = 0 so the last segment joins the
     first one exactly (otherwise crossing the lap line snaps the world). */
  function closeTrack(track) {
    var y = lastY(track);
    var n, len, slope;
    if (Math.abs(y) > 0.5) {
      len = clamp(Math.round(Math.abs(y) / (SEG_LEN * 0.34)), 34, 220);
      slope = -y / (len * SEG_LEN);
      addRoad(track, Math.round(len * 0.3), Math.round(len * 0.4), Math.round(len * 0.3), 0, slope);
    }
    /* guarantee both ends of the seam are dead flat and dead straight */
    addStraight(track, CLOSING_STRAIGHT);
    for (n = 0; n < CLOSING_STRAIGHT; n++) {
      track.segments[track.segments.length - 1 - n].curve = 0;
    }
    /* the opening straight is flat/straight by construction; assert it so the
       seam is provably clean whichever way the recipe evolved */
    for (n = 0; n < 8; n++) {
      track.segments[n].curve = 0;
      track.segments[n].p1.world.y = 0;
      track.segments[n].p2.world.y = 0;
    }
    snapToZero(track);
  }

  /* ------------------------------------------------------------- scenery --- */

  function sceneryNames(theme) {
    var cand = null, ok, i;
    if (typeof SPRITES !== 'undefined' && SPRITES && SPRITES.SCENERY) {
      cand = SPRITES.SCENERY[theme.key];
    }
    if (cand && cand.length) {
      if (typeof SPRITES.has === 'function') {
        ok = [];
        try {
          for (i = 0; i < cand.length; i++) {
            if (SPRITES.has(cand[i])) { ok.push(cand[i]); }
          }
        } catch (e) { ok = []; }
        if (ok.length >= 2) { return ok; }
      }
      return cand;
    }
    if (theme.scenery && theme.scenery.length) { return theme.scenery; }
    return ['palm', 'bush', 'rock', 'lamp'];
  }

  /* Sprites sitting further from the road are drawn smaller, so a verge of
     palms reads as depth instead of a wall of identical trees. */
  function vergeScale(rng, offset) {
    var s = 0.9 + rng() * 0.75;
    s = s * (1.42 - 0.20 * Math.abs(offset));
    return clamp(s, 0.55, 2.0);
  }

  function addScenery(track, theme, rng) {
    var names = sceneryNames(theme);
    var segs = track.segments;
    var n = segs.length;
    var i = 8, gap, off, side, name, seg, big;

    while (i < n) {
      i += CORE.rndInt(rng, 3, 9);
      if (i >= n) { break; }
      seg = segs[i];
      side = rng() < 0.5 ? -1 : 1;
      off = side * CORE.rnd(rng, 1.25, 3.0);
      name = CORE.pick(rng, names);
      seg.sprites.push({ source: name, offset: off, scale: vergeScale(rng, off) });

      if (rng() < 0.34) {
        off = -side * CORE.rnd(rng, 1.4, 2.9);
        name = CORE.pick(rng, names);
        seg.sprites.push({ source: name, offset: off, scale: vergeScale(rng, off) });
      }
    }

    /* landmarks: billboards and arches, evenly spaced but never in the
       opening straight (they would block the start line). */
    big = 0;
    for (i = 120; i < n - 20; i += 96) {
      seg = segs[i + Math.floor(rng() * 24)];
      if (!seg) { continue; }
      big++;
      if (big % 3 === 0 && theme.scenery && theme.scenery.length) {
        seg.sprites.push({ source: 'arch', offset: 0, scale: 2.4 });
      } else {
        off = (rng() < 0.5 ? -1 : 1) * CORE.rnd(rng, 1.6, 2.2);
        seg.sprites.push({
          source: 'billboard_' + CORE.rndInt(rng, 0, 3),
          offset: off,
          scale: 1.35 + rng() * 0.5
        });
      }
    }
  }

  /* ---------------------------------------------------------------- cars --- */

  function buildCars(track, stage, rng) {
    var count = Math.max(0, stage.traffic | 0);
    var cars = [];
    var i, kind, car, z, span, off;
    var trackLength = track.trackLength;
    /* keep the start grid clear so the player is not immediately hit */
    var head = OPENING_STRAIGHT * SEG_LEN * 2;
    span = Math.max(SEG_LEN * 40, trackLength - head - SEG_LEN * 40);

    for (i = 0; i < count; i++) {
      kind = CAR_KINDS[CORE.rndInt(rng, 0, CAR_KINDS.length - 1)];
      z = head + (i / Math.max(1, count)) * span + CORE.rnd(rng, -SEG_LEN * 3, SEG_LEN * 3);
      z = CORE.wrapZ(z, trackLength);
      off = CORE.rnd(rng, -0.82, 0.82);
      car = {
        offset: off,
        z: z,
        sprite: kind.sprite,
        speed: CORE.rnd(rng, kind.lo, kind.hi) * T.MAX_SPEED,
        w: kind.w,
        h: kind.h,
        segIndex: Math.floor(z / SEG_LEN) % track.segments.length,
        percent: (z % SEG_LEN) / SEG_LEN
      };
      cars.push(car);
      track.segments[car.segIndex].cars.push(car);
    }
    return cars;
  }

  /* -------------------------------------------------------------- build ---- */

  function build(stageIndex) {
    var idx = clamp(stageIndex | 0, 0, CORE.STAGES.length - 1);
    var stage = CORE.STAGES[idx];
    var theme = CORE.THEMES[stage.theme] || CORE.THEMES.sunset;
    var rng = CORE.rng(stage.seed);

    var track = {
      stageIndex: idx,
      theme: theme,
      name: stage.name,
      segments: [],
      trackLength: 0,
      checkpoints: [],
      cars: [],
      seed: stage.seed,
      lanes: T.LANES,
      roadWidth: ROAD_WIDTH,
      segmentLength: SEG_LEN,
      lapCount: stage.laps
    };

    buildMoves(track, stage, rng);
    closeTrack(track);

    var n = track.segments.length;
    track.trackLength = n * SEG_LEN;

    /* checkpoints: first entry is the start/finish line (segment 0) and the
       LAST entry repeats it, so the array closes the lap — crossing the final
       gate returns you to the line.  The interior entries are strictly
       ascending segment indices.  `state.nextCheckpoint` indexes THIS array. */
    var g, gates = [];
    for (g = 0; g < CHECKPOINT_GATES; g++) {
      gates.push(Math.floor(n * g / CHECKPOINT_GATES));
    }
    gates[0] = 0;
    gates.push(gates[0]);
    track.checkpoints = gates;

    addScenery(track, theme, rng);
    track.cars = buildCars(track, stage, rng);

    return track;
  }

  /* ---------------------------------------------------------- projection --- */

  function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
    var w = p.world;
    var wx = w.x || 0, wy = w.y || 0, wz = w.z || 0;
    var cz = wz - cameraZ;
    var scale = cameraDepth / cz;

    p.camera.x = wx - cameraX;
    p.camera.y = wy - cameraY;
    p.camera.z = cz;

    p.screen.scale = scale;
    p.screen.x = Math.round((width / 2) + (scale * p.camera.x * width / 2));
    p.screen.y = Math.round((height / 2) - (scale * p.camera.y * height / 2));
    p.screen.w = Math.round(scale * roadWidth * width / 2);
    return p;
  }

  /* ------------------------------------------------------------- lookups --- */

  function segmentAt(track, index) {
    var segs = track.segments;
    var n = segs.length;
    if (n === 0) { return null; }
    var i = index % n;
    if (i < 0) { i += n; }
    return segs[i];
  }

  function findSegment(track, z) {
    var segs = track.segments;
    var n = segs.length;
    if (n === 0) { return null; }
    var len = track.trackLength || (n * SEG_LEN);
    var i = Math.floor(CORE.wrapZ(z, len) / SEG_LEN);
    if (!(i >= 0)) { i = 0; }
    if (i >= n) { i = n - 1; }
    return segs[i];
  }

  function playerSegmentIndex(track, position) {
    var seg = findSegment(track, position + T.PLAYER_Z);
    return seg ? seg.index : 0;
  }

  /* --------------------------------------------------------------- misc ---- */

  /* Fraction of a lap completed, 0..1 (handy for the HUD). */
  function lapProgress(track, position) {
    if (!track || !track.trackLength) { return 0; }
    return CORE.wrapZ(position, track.trackLength) / track.trackLength;
  }

  function selfTest() {
    var checks = [], t, i, ok;
    function ck(name, good, detail) { checks.push({ name: name, ok: !!good, detail: detail || '' }); }

    for (i = 0; i < CORE.STAGES.length; i++) {
      t = build(i);
      ck('segments[' + i + ']>=1200', t.segments.length >= MIN_SEGMENTS, String(t.segments.length));
      ck('seam-y[' + i + ']', Math.abs(t.segments[t.segments.length - 1].p2.world.y - t.segments[0].p1.world.y) < 1e-6);
      ck('seam-curve[' + i + ']', t.segments[t.segments.length - 1].curve === 0 && t.segments[0].curve === 0);
      ck('trackLength[' + i + ']', t.trackLength === t.segments.length * SEG_LEN);
      var cps = t.checkpoints;
      var last = cps.length - 1;
      ok = cps.length >= 2 && cps[0] === 0 && cps[last] === cps[0];
      for (var c = 1; c < last; c++) {
        if (!(cps[c] > cps[c - 1])) { ok = false; }
        if (cps[c] >= t.segments.length) { ok = false; }
      }
      ck('checkpoints[' + i + ']', ok, t.checkpoints.join(','));
      ck('cars[' + i + ']', t.cars.length === CORE.STAGES[i].traffic, String(t.cars.length));
    }

    var p = { world: { x: 0, y: 0, z: 2000 }, camera: {}, screen: {} };
    project(p, 0, 0, 0, T.CAMERA_DEPTH, CORE.W, CORE.H, ROAD_WIDTH);
    var far = { world: { x: 0, y: 0, z: 20000 }, camera: {}, screen: {} };
    project(far, 0, 0, 0, T.CAMERA_DEPTH, CORE.W, CORE.H, ROAD_WIDTH);
    ck('project.scale-near-bigger', p.screen.scale > far.screen.scale,
      p.screen.scale.toFixed(6) + ' > ' + far.screen.scale.toFixed(6));
    ck('project.w-near-bigger', p.screen.w > far.screen.w, p.screen.w + ' > ' + far.screen.w);
    ck('project.centre', far.screen.x === CORE.W / 2 && far.screen.y === CORE.H / 2);

    ok = true;
    for (i = 0; i < checks.length; i++) { if (!checks[i].ok) { ok = false; } }
    return { ok: ok, checks: checks };
  }

  return {
    CURVE: CURVE,
    SLOPE: SLOPE,
    MIN_SEGMENTS: MIN_SEGMENTS,

    build: build,
    project: project,
    findSegment: findSegment,
    segmentAt: segmentAt,
    playerSegmentIndex: playerSegmentIndex,
    lapProgress: lapProgress,

    selfTest: selfTest
  };
})();

<script>
/* ==== src/sprites.js (46.6 kB) ==== */
/* ==========================================================================
 * NEON DRIFT '86  —  src/sprites.js
 * 100% procedural pixel art.  Nothing is ever loaded from disk or network:
 * every sprite is painted at boot into an offscreen canvas, pixel by pixel,
 * from hand-authored pixel-map strings plus a small parametric painter used
 * for the organic shapes (palm fronds, fir tiers, explosions, arches).
 *
 *   - hard edges only: every mark is an integer fillRect on a 1px grid,
 *     plus a 1px ink outline stamped around each silhouette so scenery reads
 *     against the sunset / night / dawn skies alike
 *   - no shadowBlur, no gradients, no anti-aliased curves, no text fonts
 *   - the module top level touches no DOM: everything happens in init()
 *   - missing/broken canvas support degrades to get() -> null, never throws
 *
 * Exposes the single global SPRITES.  Requires CORE (loaded first).
 * ========================================================================== */
var SPRITES = (function () {
  'use strict';

  var OUTLINE = '#100a18';   /* one ink for every silhouette */

  var reg = {};              /* name -> {canvas,w,h,anchor} */
  var order = [];            /* registration order */
  var inited = false;

  /* ====================================================================== *
   *  1. colour helpers
   * ====================================================================== */

  var INK_RGB = [0x10, 0x0a, 0x18];

  function hex2rgb(h) {
    var s = String(h === undefined || h === null ? '#000000' : h).replace(/^\s*#/, '');
    if (s.length === 3) {
      s = s.charAt(0) + s.charAt(0) + s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2);
    }
    var n = parseInt(s, 16);
    if (!isFinite(n)) { n = 0; }

  }

  function hex2(v) {
    var s = Math.round(v);

    return t.length < 2 ? '0' + t : t;
  }

  function rgb2hex(r, g, b) { return '#' + hex2(r) + hex2(g) + hex2(b); }

  /* amt < 0 shades toward the outline ink, amt > 0 toward white */
  function shade(hex, amt) {

      for (i = 0; i < 3; i++) { out[i] = c[i] + (INK_RGB[i] - c[i]) * (-amt); }
    } else {
      for (i = 0; i < 3; i++) { out[i] = c[i] + (255 - c[i]) * amt; }
    }
    return rgb2hex(out[0], out[1], out[2]);
  }

  function mix(a, b, t) {
    var ca = hex2rgb(a), cb = hex2rgb(b), i, out = [];
    for (i = 0; i < 3; i++) { out[i] = ca[i] + (cb[i] - ca[i]) * t; }
    return rgb2hex(out[0], out[1], out[2]);
  }

  function rgba(hex, a) {
    var c = hex2rgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  /* average of one field across all three stage themes (used to keep scenery
     harmonised with CORE.THEMES without giving it a per-theme variant) */
  function themeAvg(field, amt) {
    var keys = ['sunset', 'night', 'dawn'], r = 0, g = 0, b = 0, i, c, n = 0, th;
    if (typeof CORE === 'undefined' || !CORE || !CORE.THEMES) { return '#808080'; }
    for (i = 0; i < keys.length; i++) {
      th = CORE.THEMES[keys[i]];
      if (!th || !th[field]) { continue; }
      c = hex2rgb(th[field]);
      r += c[0]; g += c[1]; b += c[2]; n++;
    }
    if (!n) { return '#808080'; }
    return shade(rgb2hex(r / n, g / n, b / n), amt || 0);
  }

  function themeColor(key, field, amt) {
    var th;
    if (typeof CORE === 'undefined' || !CORE || !CORE.THEMES) { return '#808080'; }
    th = CORE.THEMES[key];
    if (!th || !th[field]) { return '#808080'; }
    return shade(th[field], amt || 0);
  }

  /* ====================================================================== *
   *  2. canvas + painter
   * ====================================================================== */

  function newSurface(w, h) {
    var cv = null, g = null;
    try {
      if (typeof CORE !== 'undefined' && CORE && typeof CORE.makeCanvas === 'function') {
        cv = CORE.makeCanvas(w, h);
      }
    } catch (e) { cv = null; }
    if (!cv) { return null; }
    try {
      if (typeof cv.getContext !== 'function') { return null; }
      g = cv.getContext('2d');
      if (!g || typeof g.fillRect !== 'function') { return null; }

  /* A painter is a small integer grid with a parallel coverage mask, so the
     ink outline can be stamped around the union of everything drawn. */
  function Painter(w, h, opts) {
    opts = opts || {};

    this.h = Math.max(1, h | 0);

    this.ink = opts.outline || null;
    var s = newSurface(this.w + this.pad * 2, this.h + this.pad * 2);
    this.surf = s;

  Painter.prototype.px = function (x, y, col) {
    x = Math.round(x); y = Math.round(y);
    if (!this.g || !col || x < 0 || y < 0 || x >= this.w || y >= this.h) { return; }
    this.g.fillStyle = col;
    this.g.fillRect(x + this.pad, y + this.pad, 1, 1);
    this.mask[y * this.w + x] = 1;

  Painter.prototype.fill = function (x, y, w, h, col) {
    if (!this.g || !col) { return; }

    var x0 = x < 0 ? 0 : x, y0 = y < 0 ? 0 : y;
    var x1 = x + w > this.w ? this.w : x + w, y1 = y + h > this.h ? this.h : y + h;
    if (x1 <= x0 || y1 <= y0) { return; }

    this.g.fillRect(x0 + this.pad, y0 + this.pad, x1 - x0, y1 - y0);
    var i, j;
    for (j = y0; j < y1; j++) {
      for (i = x0; i < x1; i++) { this.mask[j * this.w + i] = 1; }

  /* checkerboard fill — the 1986 way of faking transparency */
  Painter.prototype.dither = function (x, y, w, h, col, phase) {
    if (!this.g || !col) { return; }

    phase = phase || 0;
    var i, j;
    for (j = 0; j < h; j++) {
      for (i = 0; i < w; i++) {
        if (((x + i + y + j + phase) & 1) === 0) { this.px(x + i, y + j, col); }
      }
    }
  };

  /* a 1px frame around a box (inside the box) */
  Painter.prototype.frame = function (x, y, w, h, col) {
    this.fill(x, y, w, 1, col);
    this.fill(x, y + h - 1, w, 1, col);
    this.fill(x, y, 1, h, col);
    this.fill(x + w - 1, y, 1, h, col);
  };

  /* stamped pixel-map:  rows[y] is a string of single-char colour keys.

  Painter.prototype.map = function (rows, pal, ox, oy, clip) {
    if (!this.g) { return; }

    lo = clip && clip.x0 !== undefined ? clip.x0 : -1e9;
    hi = clip && clip.x1 !== undefined ? clip.x1 : 1e9;
    for (j = 0; j < rows.length; j++) {
      y = oy + j;
      if (y < 0 || y >= this.h) { continue; }
      row = rows[j];
      i = 0;
      while (i < row.length) {
        col = pal[row.charAt(i)];
        if (!col) { i++; continue; }

        while (k < row.length && pal[row.charAt(k)] === col) { k++; }
        rx = ox + i; rw = k - i;
        if (rx < lo) { rw -= (lo - rx); rx = lo; }
        if (rx + rw > hi + 1) { rw = hi + 1 - rx; }
        if (rw > 0) { this.fill(rx, y, rw, 1, col); }

      }
    }

  Painter.prototype.stroke = function (col) {
    if (!this.g || !col) { return; }
    this.g.fillStyle = col;
    var w = this.w, h = this.h, m = this.mask, x, y, i;
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        i = y * w + x;
        if (m[i]) { continue; }
        if ((x > 0 && m[i - 1]) || (x < w - 1 && m[i + 1]) ||
            (y > 0 && m[i - w]) || (y < h - 1 && m[i + w])) {

  Painter.prototype.finish = function (anchor) {
    if (!this.cv) { return null; }
    if (this.ink) { try { this.stroke(this.ink); } catch (e) { /* keep the art */ } }

  /* ====================================================================== *
   *  3. pixel-map helpers
   * ====================================================================== */

  function rev(s) {

    var out = [], i, h;

    var out = [], i;

    return out;

   *  4. palettes
   * ====================================================================== */

  /* Player car: works-livery red with a cream stripe.  A saturated body is
     what makes a 48px sprite read at a glance — white/silver turns to mush
     once the renderer scales it down. */
  var HERO_PAL = {
    k: OUTLINE,
    D: '#6d0e1d', d: '#a8172f', b: '#e01f3a', h: '#f04a5f', H: '#ff8f9c',
    w: '#1a1226', W: '#3d4d8a',
    t: '#111119', T: '#34343f',
    r: '#9c0f22', R: '#ff5a68', g: '#ffb020',
    c: '#dce0ea', C: '#666b7a',
    x: '#0c0912',
    m: '#f5efe0', n: '#22e0ff', y: '#ffd23f'

  var HERO_PAL_BRAKE = (function () {
    var p = {}, key;
    for (key in HERO_PAL) {
      if (Object.prototype.hasOwnProperty.call(HERO_PAL, key)) { p[key] = HERO_PAL[key]; }

  function carPal(base, accent) {
    return {
      k: OUTLINE,
      D: shade(base, -0.60), d: shade(base, -0.36), b: base,
      h: shade(base, 0.16), H: shade(base, 0.40),
      w: '#171232', W: '#2c3c72',
      t: '#111119', T: '#34343f',
      r: '#c8102e', R: '#ff5568', g: '#ff97a4',
      c: '#a9aebd', C: '#5c6272',
      x: '#0c0912', y: '#ffd23f',
      m: accent || '#ff2fb9', n: '#22e0ff'
